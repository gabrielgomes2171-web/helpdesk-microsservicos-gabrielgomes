# Configuração comum a todos os contêineres (as mesmas proteções do monólito)
x-servico: &servico
  env_file: .env              # JWT_SEGREDO e demais configurações; nunca no código
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  gateway:
    <<: *servico
    build: ./gateway
    ports:
      - "127.0.0.1:8000:8000"   # ÚNICA porta publicada
    depends_on: [usuarios, inventario, chamados]

  usuarios:
    <<: *servico
    build: ./servicos/usuarios
    volumes:
      - usuarios-dados:/dados   # banco só deste serviço
    # sem "ports": acessível apenas dentro da rede do Docker

  inventario:
    <<: *servico
    build: ./servicos/inventario
    volumes:
      - inventario-dados:/dados

  chamados:
    <<: *servico
    build: ./servicos/chamados
    environment:
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      TIMEOUT_SEGUNDOS: "3"
    volumes:
      - chamados-dados:/dados

volumes:
  usuarios-dados:
  inventario-dados:
  chamados-dados: